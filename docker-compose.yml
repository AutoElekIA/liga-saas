services:
  postgres:
    image: postgres:16-alpine
    container_name: liga-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: liga_dev_password
      POSTGRES_DB: liga_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d liga_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: liga-saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
